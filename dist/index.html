<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>换乘查询</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        .map-container {
            width: 100%;
            height: 300px;
            margin: 10px 0;
        }
    </style>
</head>

<body style="
    max-width: 500px;
    margin: 0 auto;
    padding: 1rem 0.5rem;
">
    <h1>换乘查询</h1>
    <p>此工具仅为辅助参考，未包含非每日开行列车数据，且受铁路运行图调整或其他不可控因素影响，信息准确性无法保证。<br><em>数据截至 2025-08-10T01:13:57+09:00 </em>
    </p>
    <div>
        起点：<input type="text" id="o" value="" autocomplete="off"><label><input type="checkbox" id="esc_o"
                checked>同城站</label><br>
        终点：<input type="text" id="d" value="" autocomplete="off"><label><input type="checkbox" id="esc_d"
                checked>同城站</label>
        <br>
        <div id="suggestions" style="height:20px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;">&nbsp;</div>
        <label>换乘时间：</label>
        <input type="number" id="mtt" value="0"> 分钟
        <br>
        <label><input type="checkbox" id="show_stations"> 显示途径站点</label>
        <br><br>
        <button id="ab">搜索</button>
    </div>
    <div id="st"></div>
    <div id="rs"></div>
    <script>
        let w = null;
        let jcnt = 0;
        let srch = false;
        let d_init = false;
        let stns = [];
        let cur_in = null;
        const ts = Date.now();

        let j_buf = [];
        let j_idx = 0;
        const B_SZ = 50;
        let max_disp = B_SZ;
        let sc_act = false;

        let isDisplaying = false;

        function up_st(msg) { document.getElementById('st').innerHTML = `<p><strong>${msg}</strong></p>`; }

        function show_sug(input) {
            cur_in = input;
            const q = input.value.toLowerCase();
            if (!q || !stns) { hide_sug(); return; }
            const matches = stns.filter(s => s.toLowerCase().includes(q)).slice(0, 8);
            if (matches.length === 0) { hide_sug(); return; }
            document.getElementById('suggestions').innerHTML = matches.map(s => `<a href="#" onmousedown="sel_sug('${s}'); return false;">${s}</a>`).join(' | ');
        }

        function hide_sug() { document.getElementById('suggestions').innerHTML = '&nbsp;'; }

        function sel_sug(s) {
            if (cur_in) { cur_in.value = s; }
            hide_sug();
            cur_in = null;
        }


        async function disp_j(jny, i) {
            const rdiv = document.getElementById('rs');
            const xfers = calc_x(jny.p);
            const { pathDetails, trainStops } = await gen_jdet(jny);
            const routeStations = jny.allStations || [];
            const jdiv = document.createElement('div');
            
            let stationsInfo = '';
            let mapContainer = '';
            if (document.getElementById('show_stations').checked) {
                stationsInfo = `<p><strong>途径站点：</strong> ${routeStations.join(' → ')}</p>`;
                mapContainer = `<div id="map-${i}" class="map-container"></div>`;
            }
            
            jdiv.innerHTML = `
    <hr><h3>方案 ${i}</h3>
    <p><strong>用时：</strong> ${fmt_dur(jny.tdur)} | <strong>换乘：</strong> ${xfers}次</p>
    <p>${jny.p[0].r.bs} ${fmt_at(jny.idt)} → ${jny.p[jny.p.length - 1].r.al} ${fmt_at(jny.aat)}</p>
    ${stationsInfo}
    <h4>路径：</h4><ul>${pathDetails}</ul>
    ${mapContainer}`;
            rdiv.appendChild(jdiv);
            
            if (document.getElementById('show_stations').checked && trainStops && trainStops.length > 0) {
                init_m(i, trainStops);
            }
        }

        async function upd_d() {
            if (isDisplaying) return;
            isDisplaying = true;

            try {
                while (j_idx < j_buf.length) {
                    if (j_idx >= max_disp) {
                        break;
                    }
                    await disp_j(j_buf[j_idx], j_idx + 1);
                    j_idx++;
                }
            } finally {
                isDisplaying = false;
            }
        }

        function is_ab() {
            return (window.innerHeight + window.scrollY) >= document.body.offsetHeight - 100;
        }

        function on_scr() {
            if (is_ab() && j_idx < j_buf.length) {
                if (j_idx >= max_disp) {
                    max_disp += B_SZ;
                    upd_d();
                }
            }
        }
        
        function add_sl() {
            if (!sc_act) {
                window.addEventListener('scroll', on_scr, { passive: true });
                sc_act = true;
            }
        }

        function rm_sl() {
            if (sc_act) {
                window.removeEventListener('scroll', on_scr);
                sc_act = false;
            }
        }

        function fmt_dur(m) {
            if (m === null) return "N/A";
            const d = Math.floor(m / 1440), rem = m % 1440, h = Math.floor(rem / 60), mins = rem % 60;
            let p = [];
            if (d > 0) p.push(d + "天"); if (h > 0) p.push(h + "小时"); if (mins > 0) p.push(mins + "分钟");
            return p.length > 0 ? p.join(" ") : "0分钟";
        }

        function fmt_at(am) {
            if (am === null) return "N/A";
            const day = Math.floor(am / 1440), rem = am % 1440, h = Math.floor(rem / 60), m = rem % 60;
            return `Day ${day + 1}, ${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
        }

        function calc_x(p) {
            if (!p || p.length <= 1) return 0;
            let x = 0;
            for (let i = 1; i < p.length; i++) { if (p[i].r.tn !== p[i - 1].r.tn) x++; }
            return x;
        }

        async function gen_jdet(jny) {
            let h = '', ct = jny.idt;
            const allStations = [];
            const trainStops = [];
            for (let i = 0; i < jny.p.length; i++) {
                const ps = jny.p[i], r = ps.r;
                if (ps.wtb > 0 && i > 0 && r.tn !== jny.p[i - 1].r.tn) {
                    h += `<li><strong>${r.bs} 换乘</strong> (${fmt_dur(ps.wtb)})</li>`;
                }
                ct += ps.wtb;
                const bts = fmt_at(ct).slice(-5), ss = r.bs;
                ct += r.dur;
                let fs = r.al, fat = ct;
                let j = i + 1;
                while (j < jny.p.length && jny.p[j].r.tn === r.tn) {
                    const ns = jny.p[j];
                    fat += ns.wtb + ns.r.dur;
                    fs = ns.r.al;
                    j++;
                }
                const fats = fmt_at(fat).slice(-5);
                
                if (document.getElementById('show_stations').checked) {
                    try {
                        const stops = await gts(r.tn, ss, fs);
                        const stationNames = stops.map(stop => stop.n);
                        const uniqueStations = [];
                        for (const station of stationNames) {
                            if (!uniqueStations.includes(station)) {
                                uniqueStations.push(station);
                            }
                        }
                        allStations.push(...uniqueStations);
                        
                        trainStops.push(...stops);
                        
                        h += `<li><strong>${r.tn}:</strong> ${ss} ${bts} → ${fs} ${fats}</li>`;
                    } catch (error) {
                        h += `<li><strong>${r.tn}:</strong> ${ss} ${bts} → ${fs} ${fats}</li>`;
                    }
                } else {
                    h += `<li><strong>${r.tn}:</strong> ${ss} ${bts} → ${fs} ${fats}</li>`;
                }
                
                if (j > i + 1) { ct = fat; i = j - 1; }
            }
            jny.allStations = [...new Set(allStations)];
            return { pathDetails: h, trainStops };
        }

        function act() { if (srch) stop_s(); else start_s(); }

        function up_ab() {
            const btn = document.getElementById('ab');
            btn.textContent = srch ? '停止' : '搜索';
            btn.disabled = (!d_init && !srch);
        }

        function start_s() {
            if (srch || !d_init) return;
            const o = document.getElementById('o').value.trim();
            const d = document.getElementById('d').value.trim();
            if (!o || !d) { up_st('输入起点和终点'); return; }

            rm_sl();
            j_buf = [];
            j_idx = 0;
            jcnt = 0;
            max_disp = B_SZ;
            isDisplaying = false; 

            srch = true;
            up_ab();
            document.getElementById('rs').innerHTML = '';
            up_st('搜索');
            
            add_sl();

            w.postMessage({
                t: 'start', o, d,
                mtt: parseInt(document.getElementById('mtt').value),
                esc_o: document.getElementById('esc_o').checked,
                esc_d: document.getElementById('esc_d').checked
            });
        }

        function stop_s() {
            if (srch && w) {
                w.postMessage({ t: 'stop' });
            }
            fin_s();
        }

        const gtsPromises = new Map();
        
        function gts(n,f,t) {
            if (w) {
                const requestId = Date.now() + Math.random();
                const promise = new Promise((resolve, reject) => {
                    gtsPromises.set(requestId, { resolve, reject });
                    setTimeout(() => {
                        if (gtsPromises.has(requestId)) {
                            gtsPromises.delete(requestId);
                            reject(new Error('gts request timeout'));
                        }
                    }, 10000);
                });
                
                w.postMessage({
                    t: 'gts',
                    requestId: requestId,
                    d: { n: n, f: f, t: t }
                });
                
                return promise;
            }
            
            return Promise.reject(new Error('Worker not initialized'));
        }

        function fin_s() {
            srch = false;
            up_ab();
        }

        function init_wkr() {
            if (w) return;
            up_st('加载');
            up_ab();
            w = new Worker(`worker.js?v=${ts}`);

            w.onmessage = function (e) {
                const { t, d } = e.data;
                switch (t) {
                    case 'j_fnd':
                        jcnt++;
                        j_buf.push(d);
                        up_st(`查询到 ${jcnt} 条方案`);
                        if (!isDisplaying) {
                            upd_d();
                        }
                        break;
                    case 'done':
                        fin_s();
                        if (jcnt === 0) {
                            up_st('无方案');
                        } else {
                            if (!isDisplaying) {
                                upd_d();
                            }
                            up_st(`共 ${jcnt} 条方案`);
                        }
                        break;
                    case 'err':
                        up_st(d);
                        fin_s();
                        break;
                    case 'stat':
                        up_st(d);
                        break;
                    case 'init_done':
                        d_init = true;
                        up_st('就绪');
                        up_ab();
                        w.postMessage({ t: 'get_stn' });
                        break;
                    case 'stn':
                        stns = d;
                        break;
                    case 'ts':
                        if (e.data.requestId && gtsPromises.has(e.data.requestId)) {
                            const { resolve } = gtsPromises.get(e.data.requestId);
                            gtsPromises.delete(e.data.requestId);
                            resolve(d);
                        }
                        break;
                }
            };

            w.onerror = function (err) { up_st(err.message); fin_s(); };
            w.postMessage({ t: 'init_only' });
        }

        document.getElementById('o').addEventListener('keypress', (e) => { if (e.key === 'Enter') act(); });
        document.getElementById('d').addEventListener('keypress', (e) => { if (e.key === 'Enter') act(); });
        document.getElementById('o').addEventListener('input', function () { show_sug(this); });
        document.getElementById('d').addEventListener('input', function () { show_sug(this); });
        document.getElementById('o').addEventListener('focus', function () { if (this.value) show_sug(this); });
        document.getElementById('d').addEventListener('focus', function () { if (this.value) show_sug(this); });
        document.body.addEventListener('click', hide_sug, true);

        window.addEventListener('load', () => {
            document.getElementById('ab').addEventListener('click', act);
            up_ab();
            init_wkr();
        });
        up_st('启动');
        
        function init_m(mapId, stops) {
            const map = L.map(`map-${mapId}`).setView([35.8617, 104.1954], 4);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                maxZoom: 19
            }).addTo(map);
            
            if (stops && stops.length > 0) {
                const markers = [];
                const latlngs = [];
                
                stops.forEach(stop => {

                    latlngs.push([stop.lat, stop.lon]);
                    
                    const circleMarker = L.circleMarker([stop.lat, stop.lon], {
                        radius: 3,         
                        fillColor: "#000000",
                        color: "#000000",
                        weight: 1,    
                        opacity: 1,        
                        fillOpacity: 1   
                    }).addTo(map);
                    
                    circleMarker.bindPopup(stop.n);
                    markers.push(circleMarker);
                });
                
                const railwayLine = L.polyline(latlngs, {
                    color: '#000000',
                    weight: 4,
                }).addTo(map);
                
                const group = new L.featureGroup([...markers, railwayLine]);
                map.fitBounds(group.getBounds(), { padding: [50, 50] });
            }
        }
    </script>
