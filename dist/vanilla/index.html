<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>换乘查询</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        .map-container {
            width: 100%;
            height: 300px;
            margin: 10px 0;
        }

        body {
            max-width: 650px;
            margin: 40px auto;
            padding: 0 10px;
            font: 18px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
            color: #444
        }

        h1,
        h2,
        h3 {
            line-height: 1.2
        }

        @media (prefers-color-scheme: dark) {
            body {
                color: #c9d1d9;
                background: #0d1117
            }

            a:link {
                color: #58a6ff
            }

            a:visited {
                color: #8e96f0
            }
        }
    </style>
  <script type="module" crossorigin src="../assets/vanilla-DRJqPDJd.js"></script>
  <link rel="modulepreload" crossorigin href="../assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="stylesheet" crossorigin href="../assets/vanilla-B_a0r4HD.css">
</head>

<body>

    <h1>换乘查询 <span id="udt" style="font-size: 14px;"></span></h1>
    <p>站点位置信息来源网络，目前有较多错漏，仅供辅助参考。<span style="color: red;">红色</span>的车次为非每日开行车次，请自行判断方案可行性。
    </p>
    <div>
        起点：<input type="text" id="o" value="" autocomplete="off"><label><input type="checkbox" id="esc_o"
                checked>同城站</label><br>
        终点：<input type="text" id="d" value="" autocomplete="off"><label><input type="checkbox" id="esc_d"
                checked>同城站</label>
        <br>
        <div id="suggestions">&nbsp;</div>
        <label><input type="radio" name="mode" value="time" checked> 最短时间</label>
        <label><input type="radio" name="mode" value="xfer"> 最少换乘</label>
        <label><input type="radio" name="mode" value="km"> 最短里程</label>
        <br>
        <span id="mtt_container">
            <label>换乘时间：</label>
            <input type="number" id="mtt" value="0"> 分钟
            <br>
        </span>
        <label><input type="checkbox" id="show_stations"> 显示途径站点</label>
        <br>
        <div id="pbar_container" style="visibility: hidden;">
            <progress id="pbar" value="0" style="width: 100%; vertical-align: middle;"></progress>
        </div>
        <button id="ab">搜索</button>
    </div>
    <div id="st"></div>
    <div id="rs"></div>

    <hr>
    <p>
        © 2025 noxylva. Licensed under <a href="https://www.gnu.org/licenses/agpl-3.0.html" target="_blank">AGPLv3</a> |
        <a href="https://github.com/undef-i/CRTransfer" target="_blank">GitHub</a>
    </p>
</body>

</html>
