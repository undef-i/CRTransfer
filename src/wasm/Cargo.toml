[package]
name = "transit"
version = "0.1.0"
edition = "2021"



[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = { version = "0.2", features = ["enable-interning"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3.3"
serde_json = "1.0"
brotli = "7.0"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "WorkerGlobalScope", "console", "Performance"] }
cargo-lint = "0.1.0"
simd-json = { version = "0.13", features = ["serde_impl"] }

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3.3"
brotli = "7.0"
