<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>换乘查询</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        .map-container {
            width: 100%;
            height: 300px;
            margin: 10px 0;
        }

        body {
            max-width: 650px;
            margin: 40px auto;
            padding: 0 10px;
            font: 18px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
            color: #444
        }

        h1,
        h2,
        h3 {
            line-height: 1.2
        }

        @media (prefers-color-scheme: dark) {
            body {
                color: #c9d1d9;
                background: #0d1117
            }

            a:link {
                color: #58a6ff
            }

            a:visited {
                color: #8e96f0
            }
        }
    </style>
</head>

<body>
    <h1>换乘查询</h1>
    <p>鉴于铁路运行图调整及不可抗力因素，对信息之准确性不作任何保证。途径站点位置信息有部分错漏，仅供辅助参考。<span
            style="color: red;">红色</span>的车次为非每日开行车次，请自行判断方案可行性。<br>数据更新于2025年8月11日。
    </p>
    <div>
        起点：<input type="text" id="o" value="" autocomplete="off"><label><input type="checkbox" id="esc_o"
                checked>同城站</label><br>
        终点：<input type="text" id="d" value="" autocomplete="off"><label><input type="checkbox" id="esc_d"
                checked>同城站</label>
        <br>
        <div id="suggestions">&nbsp;</div>
        <label><input type="radio" name="mode" value="time" checked> 最短时间</label>
        <label><input type="radio" name="mode" value="xfer"> 最少换乘</label>
        <br>
        <span id="mtt_container">
            <label>换乘时间：</label>
            <input type="number" id="mtt" value="0"> 分钟
            <br>
        </span>
        <label><input type="checkbox" id="show_stations"> 显示途径站点</label>
        <br><br>
        <button id="ab">搜索</button>
    </div>
    <div id="st"></div>
    <div id="rs"></div>
    <script>
        let w = null;
        let jc = 0;
        let run = false;
        let rdy = false;
        let sns = [];
        let cin = null;
        let nd = [];
        const ts = Date.now();

        let jbuf = [];
        let jix = 0;
        const BSZ = 50;
        let mdisp = BSZ;
        let sact = false;

        let disp = false;
        const gtsp = new Map();

        function us(m) {
            document.getElementById('st').innerHTML = `<p><strong>${m}</strong></p>`;
        }

        function ss(inp) {
            cin = inp;
            const q = inp.value.toLowerCase();
            if (!q || !sns) { hs(); return; }
            const ms = sns.filter(s => s.toLowerCase().includes(q)).slice(0, 8);
            if (ms.length === 0) { hs(); return; }
            document.getElementById('suggestions').innerHTML = ms.map(s => `<a href="#" onmousedown="sels('${s}'); return false;">${s}</a>`).join(' | ');
        }

        function hs() { document.getElementById('suggestions').innerHTML = '&nbsp;'; }

        function sels(s) {
            if (cin) { cin.value = s; }
            hs();
            cin = null;
        }

        async function lnd() {
            try {
                const rsp = await fetch('ndt.json');
                nd = await rsp.json();
            } catch (e) {
                nd = [];
            }
        }

        function isnd(tn) { return nd.includes(tn); }

        async function dj(j, i) {
            const rd = document.getElementById('rs');
            const xfrs = calx(j.p);
            const { pd, tstps } = await gjd(j);
            const rstns = j.allStations || [];
            const jdiv = document.createElement('div');

            let si = '';
            let mc = '';
            if (document.getElementById('show_stations').checked) {
                si = `<p><strong>途径站点：</strong> ${rstns.join(' → ')}</p>`;
                mc = `<div id="map-${i}" class="map-container"></div>`;
            }

            jdiv.innerHTML = `
    <hr><h3>方案 ${i}</h3>
    <p><strong>用时：</strong> ${fdur(j.tdur)} | <strong>换乘：</strong> ${xfrs}次</p>
    <p>${j.p[0].r.bs} ${fat(j.idt)} → ${j.p[j.p.length - 1].r.al} ${fat(j.aat)}</p>
    ${si}
    <h4>路径：</h4><ul>${pd}</ul>
    ${mc}`;
            rd.appendChild(jdiv);

            if (document.getElementById('show_stations').checked && tstps && tstps.length > 0) {
                imap(i, tstps);
            }
        }

        async function ud() {
            if (disp) return;
            disp = true;
            try {
                while (jix < jbuf.length) {
                    if (jix >= mdisp) {
                        break;
                    }
                    await dj(jbuf[jix], jix + 1);
                    jix++;
                }
            } finally {
                disp = false;
            }
        }

        function isab() { return (window.innerHeight + window.scrollY) >= document.body.offsetHeight - 100; }

        function onscr() {
            if (isab() && jix < jbuf.length) {
                if (jix >= mdisp) {
                    mdisp += BSZ;
                    ud();
                }
            }
        }

        function asl() {
            if (!sact) {
                window.addEventListener('scroll', onscr, { passive: true });
                sact = true;
            }
        }

        function rsl() {
            if (sact) {
                window.removeEventListener('scroll', onscr);
                sact = false;
            }
        }

        function fdur(m) {
            if (m === null) return "N/A";
            const d = Math.floor(m / 1440), rem = m % 1440, h = Math.floor(rem / 60), mins = rem % 60;
            let p = [];
            if (d > 0) p.push(d + "天"); if (h > 0) p.push(h + "小时"); if (mins > 0) p.push(mins + "分钟");
            return p.length > 0 ? p.join(" ") : "0分钟";
        }

        function fat(am) {
            if (am === null) return "N/A";
            const day = Math.floor(am / 1440), rem = am % 1440, h = Math.floor(rem / 60), m = rem % 60;
            return `第${day + 1}天 ${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
        }

        function calx(p) {
            if (!p || p.length <= 1) return 0;
            let x = 0;
            for (let i = 1; i < p.length; i++) { if (p[i].r.tn !== p[i - 1].r.tn) x++; }
            return x;
        }

        async function gjd(j) {
            let h = '', ct = j.idt;
            const all_sns = [];
            const tstps = [];
            for (let i = 0; i < j.p.length; i++) {
                const ps = j.p[i], r = ps.r;
                if (ps.wtb > 0 && i > 0 && r.tn !== j.p[i - 1].r.tn) {
                    h += `<li><strong>${r.bs} 换乘</strong> (${fdur(ps.wtb)})</li>`;
                }
                ct += ps.wtb;
                const bts = fat(ct).slice(-5), ss = r.bs;
                ct += r.dur;
                let fs = r.al, fat_v = ct;
                let k = i + 1;
                while (k < j.p.length && j.p[k].r.tn === r.tn) {
                    const ns = j.p[k];
                    fat_v += ns.wtb + ns.r.dur;
                    fs = ns.r.al;
                    k++;
                }
                const fats = fat(fat_v).slice(-5);
                const is_nd = isnd(r.tn);
                const tstyle = is_nd ? ' style="color: red;"' : '';

                if (document.getElementById('show_stations').checked) {
                    try {
                        const stops = await gts(r.tn, ss, fs);
                        const snames = stops.map(stop => stop.n);
                        const usns = [];
                        for (const sn of snames) {
                            if (!usns.includes(sn)) {
                                usns.push(sn);
                            }
                        }
                        all_sns.push(...usns);
                        tstps.push(...stops);
                        h += `<li><strong${tstyle}>${r.tn}:</strong> ${ss} ${bts} → ${fs} ${fats}</li>`;
                    } catch (e) {
                        h += `<li><strong${tstyle}>${r.tn}:</strong> ${ss} ${bts} → ${fs} ${fats}</li>`;
                    }
                } else {
                    h += `<li><strong${tstyle}>${r.tn}:</strong> ${ss} ${bts} → ${fs} ${fats}</li>`;
                }
                if (k > i + 1) { ct = fat_v; i = k - 1; }
            }
            j.allStations = [...new Set(all_sns)];
            return { pd: h, tstps };
        }

        function act() { if (run) stp_s(); else s_s(); }

        function uab() {
            const btn = document.getElementById('ab');
            btn.textContent = run ? '停止' : '搜索';
            btn.disabled = (!rdy && !run);
        }

        function s_s() {
            if (run || !rdy) return;
            const o_val = document.getElementById('o').value.trim();
            const d_val = document.getElementById('d').value.trim();
            if (!o_val || !d_val) { us('输入起点和终点'); return; }

            rsl();
            jbuf = [];
            jix = 0;
            jc = 0;
            mdisp = BSZ;
            disp = false;

            run = true;
            uab();
            document.getElementById('rs').innerHTML = '';
            us('搜索');
            asl();

            const mode = document.querySelector('input[name="mode"]:checked').value;

            w.postMessage({
                t: mode === 'xfer' ? 'start_mx' : 'start',
                o: o_val,
                d: d_val,
                mtt: parseInt(document.getElementById('mtt').value),
                esc_o: document.getElementById('esc_o').checked,
                esc_d: document.getElementById('esc_d').checked
            });
        }

        function stp_s() {
            if (run && w) {
                w.postMessage({ t: 'stop' });
            }
            f_s();
        }

        function gts(n, f, t) {
            if (w) {
                const rid = Date.now() + Math.random();
                const p = new Promise((res, rej) => {
                    gtsp.set(rid, { res, rej });
                    setTimeout(() => {
                        if (gtsp.has(rid)) {
                            gtsp.delete(rid);
                            rej(new Error('gts request timeout'));
                        }
                    }, 10000);
                });
                w.postMessage({ t: 'gts', requestId: rid, d: { n, f, t } });
                return p;
            }
            return Promise.reject(new Error('Worker not initialized'));
        }

        function f_s() {
            run = false;
            uab();
        }

        function iw() {
            if (w) return;
            us('加载');
            uab();
            w = new Worker(`worker.js?v=${ts}`);
            w.onmessage = function (e) {
                const { t, d, requestId } = e.data;
                switch (t) {
                    case 'j_fnd':
                        jc++;
                        jbuf.push(d);
                        us(`查询到 ${jc} 条方案`);
                        if (!disp) ud();
                        break;
                    case 'done':
                        f_s();
                        if (jc === 0) {
                            us('无方案');
                        } else {
                            if (!disp) ud();
                            us(`共 ${jc} 条方案`);
                        }
                        break;
                    case 'err':
                        us(d);
                        f_s();
                        break;
                    case 'stat':
                        us(d);
                        break;
                    case 'init_done':
                        rdy = true;
                        us('就绪');
                        uab();
                        w.postMessage({ t: 'get_stn' });
                        break;
                    case 'stn':
                        sns = d;
                        break;
                    case 'ts':
                        if (requestId && gtsp.has(requestId)) {
                            const { res } = gtsp.get(requestId);
                            gtsp.delete(requestId);
                            res(d);
                        }
                        break;
                }
            };
            w.onerror = function (err) { us(err.message); f_s(); };
            w.postMessage({ t: 'init_only' });
        }
        
        function tmv() {
            const sm = document.querySelector('input[name="mode"]:checked').value;
            const mttc = document.getElementById('mtt_container');
            if (sm === 'xfer') {
                mttc.style.display = 'none'; 
            } else {
                mttc.style.display = 'inline';
            }
        }

        document.getElementById('o').addEventListener('keypress', (e) => { if (e.key === 'Enter') act(); });
        document.getElementById('d').addEventListener('keypress', (e) => { if (e.key === 'Enter') act(); });
        document.getElementById('o').addEventListener('input', function () { ss(this); });
        document.getElementById('d').addEventListener('input', function () { ss(this); });
        document.getElementById('o').addEventListener('focus', function () { if (this.value) ss(this); });
        document.getElementById('d').addEventListener('focus', function () { if (this.value) ss(this); });
        document.body.addEventListener('click', hs, true);

        window.addEventListener('load', async () => {
            document.getElementById('ab').addEventListener('click', act);
            uab();
            await lnd();
            iw();
            
            document.querySelectorAll('input[name="mode"]').forEach(radio => {
                radio.addEventListener('change', tmv);
            });
            tmv();
        });
        us('启动');

        function imap(mapId, stops) {
            const map = L.map(`map-${mapId}`).setView([35.8617, 104.1954], 4);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                maxZoom: 19
            }).addTo(map);

            if (stops && stops.length > 0) {
                const mkrs = [];
                const lls = [];

                stops.forEach(stp => {
                    if (stp.lat !== undefined && stp.lon !== undefined && 
                        stp.lat !== 0 && stp.lon !== 0 && 
                        !isNaN(stp.lat) && !isNaN(stp.lon)) {
                        lls.push([stp.lat, stp.lon]);
                        const cm = L.circleMarker([stp.lat, stp.lon], {
                            radius: 3, fillColor: "#000000", color: "#000000",
                            weight: 1, opacity: 1, fillOpacity: 1
                        }).addTo(map);
                        cm.bindPopup(stp.n);
                        mkrs.push(cm);
                    }
                });

                if (lls.length > 0) {
                    const rline = L.polyline(lls, { color: '#000000', weight: 4 }).addTo(map);
                    const grp = new L.featureGroup([...mkrs, rline]);
                    map.fitBounds(grp.getBounds(), { padding: [50, 50] });
                }
            }
        }
    </script>
